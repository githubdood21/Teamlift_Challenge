services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: teamlift
      POSTGRES_PASSWORD: teamlift
      POSTGRES_DB: teamlift
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamlift -d teamlift"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
